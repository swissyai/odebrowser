name: Build Ode

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-native-${{ github.ref }}
  cancel-in-progress: false

# Temporary candidate branch: unchanged platform/core builds passed run 43550599638.
# Compile the final test-only correction and execute the entire native suite.
jobs:
  mac-app:
    name: Build and test macOS
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-apple-build

      - name: Build native tests
        run: |
          xcodebuild build-for-testing \
            -project Ode.xcodeproj \
            -scheme Ode \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify widget stream delivery in 20 required iterations
        env:
          ODE_ISOLATED_SESSION: '1'
          # Fixtures need separate in-memory stores, not one named persistent profile.
          TEST_RUNNER_ODE_ISOLATED_SESSION: '1'
        run: |
          xcodebuild test-without-building \
            -project Ode.xcodeproj \
            -scheme Ode \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ode-widget-stream-tests.xcresult" \
            -only-testing:OdeTests/BrowserSidebarWidgetRuntimeTests \
            -test-iterations 20 \
            -test-repetition-relaunch-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test native contracts in an isolated session
        env:
          ODE_ISOLATED_SESSION: '1'
          # Fixtures need separate in-memory stores, not one named persistent profile.
          TEST_RUNNER_ODE_ISOLATED_SESSION: '1'
        run: |
          xcodebuild test-without-building \
            -project Ode.xcodeproj \
            -scheme Ode \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ode-native-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ode-final-native-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ode-native-tests.xcresult
            ${{ runner.temp }}/ode-widget-stream-tests.xcresult

      - name: Remove generated build data
        if: always()
        run: |
          Scripts/control-plane/unregister-apps.sh "$RUNNER_TEMP/crest-build-derived-data"
          find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true
