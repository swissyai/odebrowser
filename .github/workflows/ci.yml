name: Semantic answer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install repository shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: OdeCore/global.json
      - name: Generate exact contract output
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/semantic-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/semantic-evidence/source-commit.txt"
          Scripts/control-plane/generate-contracts.sh --check 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/generator.log"
          git diff --binary > "$RUNNER_TEMP/semantic-evidence/generated.patch"
      - name: Test full core with cross-checks
        run: |
          set -o pipefail
          cd OdeCore
          dotnet test tests/OdeCore.Tests --nologo --configuration Release -p:OdeCrossChecks=true --logger 'trx;LogFileName=core.trx' --results-directory "$RUNNER_TEMP/semantic-evidence" 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/core.log"
      - name: Check analyzers and architecture
        run: |
          set -o pipefail
          Scripts/control-plane/lint-dotnet.sh 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/lint.log"
          python3 Scripts/check-architecture.py 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/architecture.log"
          python3 Scripts/check-public-source.py
          git diff --check
      - name: Retain exact generated output and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-core-evidence
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/semantic-evidence
