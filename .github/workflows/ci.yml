name: Build Ode

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Public-source compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the publishable source and dependency licenses
        run: |
          git diff --check
          Scripts/check-public-source.py
          python3 Scripts/release_note_catalog.py
          Scripts/audit-licenses.py

  # Tests that need macOS tools, such as plutil, skip here. A macOS build job
  # runs the whole suite again on its runner.
  script-tests:
    name: Release and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the repository shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Test retained script contracts
        run: python3 -m unittest discover -s Scripts/Tests

  core:
    name: .NET core contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the repository shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: OdeCore/global.json

      - name: Test core contracts
        working-directory: OdeCore
        # Measure optimized code while retaining incremental-versus-full state checks.
        run: dotnet test tests/OdeCore.Tests/OdeCore.Tests.csproj --nologo --configuration Release -p:OdeCrossChecks=true

      - name: Check core analyzers and code style
        run: Scripts/control-plane/lint-dotnet.sh

      - name: Check architecture boundaries
        run: python3 Scripts/check-architecture.py

  # Pull requests and pushes to main build only the apps their files can
  # affect; manual runs build both.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.areas.outputs.mac }}
      ios: ${{ steps.areas.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide which apps the change can affect
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 Scripts/ci-changed-areas.py >> "$GITHUB_OUTPUT"

  # The three app builds run side by side on separate runners.
  chromium-host:
    name: Build Chromium product host
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-apple-build

      - name: Check Swift formatting
        run: |
          python3 - <<'PYTHON'
          import subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z", "*.swift"]).decode().split("\0")
          paths = [path for path in paths if path and "/Generated/" not in path]
          subprocess.run(["xcrun", "swift-format", "lint", "--strict", "--configuration", ".swift-format", *paths], check=True)
          PYTHON

      - name: Test script contracts with macOS tools
        run: python3 -m unittest discover -s Scripts/Tests

      - name: Build Chromium product host
        run: |
          xcodebuild build \
            -project Ode.xcodeproj \
            -scheme CrestChromiumUIProduct \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check native contracts against the built core
        run: |
          core="$RUNNER_TEMP/crest-build-derived-data/Build/Products/Release/OdeCore"
          clang -std=c11 -Wall -Wextra -Werror -I CrestContracts/include \
            CrestContracts/tests/native_abi.c "$core/OdeCore.Native.dylib" \
            -Wl,-rpath,"$core" -o "$core/native-abi"
          "$core/native-abi"
          clang++ -std=c++20 -Wall -Wextra -Werror -Wconversion -I CrestContracts/include \
            CrestContracts/tests/engine_abi.cc "$core/OdeCore.Native.dylib" \
            -Wl,-rpath,"$core" -o "$core/engine-abi"
          "$core/engine-abi"

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  mac-app:
    name: Build and test macOS
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-apple-build

      - name: Build macOS
        run: |
          xcodebuild build \
            -project Ode.xcodeproj \
            -scheme Ode \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build native tests
        run: |
          xcodebuild build-for-testing \
            -project Ode.xcodeproj \
            -scheme Ode \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test native contracts in an isolated session
        env:
          ODE_ISOLATED_SESSION: '1'
          # Fixtures need separate in-memory stores, not one named persistent profile.
          TEST_RUNNER_ODE_ISOLATED_SESSION: '1'
        run: |
          xcodebuild test-without-building \
            -project Ode.xcodeproj \
            -scheme Ode \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ode-native-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove generated build data
        if: always()
        run: |
          Scripts/control-plane/unregister-apps.sh "$RUNNER_TEMP/crest-build-derived-data"
          find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  ios-app:
    name: Build iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-apple-build

      # The Chromium host job lints Swift and tests the script contracts with
      # macOS tools whenever it runs; an iOS-only change skips that job, so
      # this one does both instead.
      - name: Check Swift formatting
        if: needs.changes.outputs.mac != 'true'
        run: |
          python3 - <<'PYTHON'
          import subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z", "*.swift"]).decode().split("\0")
          paths = [path for path in paths if path and "/Generated/" not in path]
          subprocess.run(["xcrun", "swift-format", "lint", "--strict", "--configuration", ".swift-format", *paths], check=True)
          PYTHON

      - name: Test script contracts with macOS tools
        if: needs.changes.outputs.mac != 'true'
        run: python3 -m unittest discover -s Scripts/Tests

      - name: Build iOS
        run: |
          xcodebuild build \
            -project Ode.xcodeproj \
            -scheme OdeMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/crest-build-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove generated build data
        if: always()
        run: find "$RUNNER_TEMP/crest-build-derived-data" -depth -delete 2>/dev/null || true

  website:
    name: Website and Help Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HelpCenter/package-lock.json

      - name: Build Help Center
        working-directory: HelpCenter
        run: |
          npm ci
          npm run build

  # The repository ruleset requires this job rather than each job above, so
  # every job in this workflow belongs in its needs list. A job skipped
  # because the change cannot affect it counts as passing; a failed or
  # cancelled one fails the check.
  all-checks-pass:
    name: all-checks-pass
    if: always()
    needs: [source, script-tests, core, changes, chromium-host, mac-app, ios-app, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
