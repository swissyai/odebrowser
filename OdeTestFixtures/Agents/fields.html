<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fields</title></head>
<body>
<form>
  <label>Name <input name="name" value="Alice Example"></label>
  <label>Password <input type="password" name="password" value="hunter2-secret"></label>
  <label>Card number <input name="card" autocomplete="cc-number" value="4111111111111111"></label>
  <label>Code <input name="code" autocomplete="one-time-code" value="123456"></label>
</form>
</body>
</html>
