<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Closed component</title></head>
<body>
<sign-in-field></sign-in-field>
<script>
  customElements.define("sign-in-field", class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: "closed", delegatesFocus: true });
      root.innerHTML = '<label>Password <input type="password" autocomplete="current-password"></label>';
    }
  });
</script>
</body>
</html>
