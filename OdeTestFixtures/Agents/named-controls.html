<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Named controls</title></head>
<body>
<img name="title" alt="Logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40">
<form id="search" action="/search" role="search">
  <input type="search" name="search" placeholder="Search the encyclopedia" aria-label="Search">
  <input type="hidden" name="title" value="Special:Search">
  <input type="hidden" name="hidden" value="1">
  <input type="hidden" name="tagName" value="DIV">
  <input type="hidden" name="childNodes" value="none">
  <input type="hidden" name="getAttribute" value="none">
  <input type="hidden" name="disabled" value="1">
  <button>Search</button>
</form>
<h1>Web browser</h1>
<p>A web browser is an application for accessing websites.</p>
</body>
</html>
